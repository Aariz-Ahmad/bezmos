<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    width: 240px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #222;
    padding: 14px 16px;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .title img { width: 20px; height: 20px; }
  p { margin: 0 0 8px; }
  .hint {
    font-size: 12px;
    color: #666;
    border-top: 1px solid #eee;
    margin-top: 8px;
    padding-top: 8px;
  }
</style>
</head>
<body>
  <div class="title"><img src="icons/icon48.png" alt="" /> Bezmos</div>
  <p>Head to a graph at <strong>desmos.com/calculator</strong> — Bezmos lives in the graph's own toolbar, top-right above zoom.</p>
  <div class="hint">Curves, polygons, and ovals, all shaped with draggable points. No cleanup, no renaming variables by hand.</div>
</body>
</html>
